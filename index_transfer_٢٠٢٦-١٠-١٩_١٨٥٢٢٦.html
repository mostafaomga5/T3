<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T2 | حلول التسويق الرقمي</title>
<meta name="description" content="">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:image" content="logo.png">
<meta name="theme-color" content="#14213d">
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"></noscript>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main" data-i="skip"></a>

<div class="gate" id="country-gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <div class="gate-inner">
    <div class="globe-wrap">
      <div class="wheel" id="wheel"></div>
      <div class="globe" aria-hidden="true">🌐</div>
    </div>
    <h2 id="gate-title">اختر دولتك</h2>
    <div class="gate-grid" id="gate-grid"></div>
    <button class="btn gold gate-en" id="gate-en" type="button">Continue in English 🌐</button>
  </div>
</div>
<div class="country-bg" id="country-bg" aria-hidden="true"></div>

<header class="site-header" id="header">
  <div class="wrap hdr">
    <a class="brand" href="#top" aria-label="T2">
      <span class="logo-spin" aria-hidden="true">
        <img src="logo.png" alt="" style="--z:-3px"><img src="logo.png" alt="" style="--z:-2px" class="gold"><img src="logo.png" alt="" style="--z:-1px" class="gold"><img src="logo.png" alt="" style="--z:0px">
      </span>
    </a>
    <nav class="nav" id="nav" aria-label="main">
      <a href="#services" data-i="nav_services"></a>
      <a href="#portfolio" data-i="nav_portfolio"></a>
      <a href="#all" data-i="nav_all"></a>
      <a href="#quote" data-i="nav_quote"></a>
    </nav>
    <div class="actions">
      <div class="cdd" id="cdd">
        <button class="pill tilt ripple" id="cdd-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="flag" id="cdd-flag">🌍</span><span class="label" id="cdd-label"></span><span class="caret">▾</span>
        </button>
        <ul class="cdd-list" id="cdd-list" role="listbox"></ul>
      </div>
      <button class="pill ripple" id="theme-btn" type="button" aria-pressed="false"></button>
      <button class="pill ripple" id="lang-btn" type="button"></button>
      <button class="pill menu" id="menu-btn" type="button" aria-expanded="false" aria-label="menu">☰</button>
    </div>
  </div>
</header>

<main id="main">
  <section class="hero" id="top">
    <div class="decor" aria-hidden="true">
      <img data-speed="0.12" class="d1" src="" alt="">
      <img data-speed="-0.08" class="d2" src="" alt="">
      <img data-speed="0.05" class="d3" src="" alt="">
    </div>
    <div class="wrap hero-grid">
      <div class="hero-text reveal">
        <p class="eyebrow" data-i="hero_badge"></p>
        <h1 data-i="hero_title"></h1>
        <p class="lead" data-i="hero_lead"></p>
        <div class="cta-row">
          <a class="btn gold ripple" href="#quote" data-i="hero_cta"></a>
          <a class="btn ghost ripple" href="#portfolio" data-i="hero_secondary"></a>
        </div>
      </div>
      <div class="hero-visual">
        <div class="logo-3d" id="hero-logo" aria-label="T2 logo">
          <div class="layers">
            <img src="logo.png" alt="" style="--i:0"><img src="logo.png" alt="" style="--i:1" class="gold"><img src="logo.png" alt="" style="--i:2" class="gold"><img src="logo.png" alt="" style="--i:3" class="gold"><img src="logo.png" alt="" style="--i:4" class="gold"><img src="logo.png" alt="" style="--i:5" class="gold"><img src="logo.png" alt="" style="--i:6" class="gold"><img src="logo.png" alt="" style="--i:7">
          </div>
        </div>
        <img class="char" id="char" src="" alt="">
        <img class="fig f1" alt=""><img class="fig f3" alt=""><img class="fig f6" alt="">
      </div>
    </div>
  </section>

  <div class="platforms" id="platforms" hidden></div>
  <section id="services" class="block">
    <div class="wrap">
      <h2 class="reveal" data-i="services_title"></h2>
      <p class="sub reveal" data-i="services_lead"></p>
      <ul class="pick-list" id="core-list"></ul>
    </div>
  </section>

  <section id="portfolio" class="block alt">
    <div class="wrap">
      <h2 class="reveal" data-i="portfolio_title"></h2>
      <p class="sub reveal" data-i="portfolio_lead"></p>
      <div id="pf-wrap"></div>
    </div>
  </section>

  <section id="all" class="block">
    <div class="wrap">
      <h2 class="reveal" data-i="all_title"></h2>
      <p class="sub reveal" data-i="all_lead"></p>
      <div class="groups" id="groups"></div>
    </div>
  </section>

  <section id="quote" class="block alt">
    <div class="wrap narrow">
      <h2 class="reveal" data-i="quote_title"></h2>
      <p class="sub reveal" data-i="quote_lead"></p>
      <form class="form glass reveal" id="quote-form" novalidate>
        <div class="progress" aria-live="polite">
          <div class="progress-top"><span data-i="progress_label"></span><span id="progress-val">0%</span></div>
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
        </div>
        <div class="sel-box" id="sel-box"></div>
        <label for="pkg" data-i="f_pkg"></label>
        <select id="pkg" class="field">
          <option value="basic" data-i="pkg_basic"></option>
          <option value="pro" data-i="pkg_pro"></option>
          <option value="full" data-i="pkg_full"></option>
        </select>
        <div class="row2">
          <div>
            <label for="name" data-i="f_name"></label>
            <input id="name" class="field" autocomplete="name" required aria-describedby="name-err">
            <p class="fmsg" id="name-err" role="alert"></p>
          </div>
          <div>
            <label for="biz" data-i="f_biz"></label>
            <input id="biz" class="field" autocomplete="organization">
          </div>
        </div>
        <label for="phone" data-i="f_phone"></label>
        <div class="phone-row"><span class="cc" id="cc-show">+</span><input id="phone" class="field ltr" type="tel" inputmode="tel" autocomplete="tel" required aria-describedby="phone-err"></div>
        <p class="fmsg" id="phone-err" role="alert"></p>
        <label for="notes" data-i="f_notes"></label>
        <textarea id="notes" class="field" maxlength="500"></textarea>
        <button class="btn gold block-btn ripple" type="submit" data-i="f_submit"></button>
        <p class="note" data-i="f_note"></p>
      </form>
    </div>
  </section>
</main>

<div class="order-bar" id="order-bar" hidden>
  <span id="order-count"></span>
  <a class="btn gold ripple" href="#quote" id="order-go"></a>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<footer class="footer">
  <div class="wrap foot">
    <span>© T2 · <span data-i="footer_rights"></span></span>
    <a id="wa-footer" href="https://wa.me/201090960743" target="_blank" rel="noopener" data-i="footer_contact"></a>
  </div>
</footer>

<div class="modal" id="video-modal" hidden role="dialog" aria-modal="true">
  <div class="player">
    <button class="close" id="video-close" type="button" aria-label="close">✕</button>
    <video id="video-player" controls playsinline></video>
    <p class="msg" id="video-msg" hidden></p>
  </div>
</div>

<script src="i18n.js"></script>
<script src="i18n-extra.js"></script>
<script src="app.js" defer></script>
</body>
</html>
